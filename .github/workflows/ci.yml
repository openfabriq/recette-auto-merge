name: ci
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A little slow on purpose: the engine must see the checks still running.
      - run: sleep 45
      - run: npm test
